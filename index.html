<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pulse Pioneer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="badge"><span class="dot"></span> BASE MAINNET</div>
      <div class="actions">
        <button id="btn-wallet" onclick="connectWallet()">🦊 连接钱包</button>
      </div>
    </header>

    <div id="canvas-wrap">
      <canvas id="gameCanvas"></canvas>
    <!-- 新增：飘字特效层 -->
    <div id="fx-layer" style="position: absolute; inset: 0; pointer-events: none; z-index: 6; overflow: hidden;"></div>
      <div id="hud">
        <div class="top">
          <span>SCORE <b id="hud-score">0</b></span>
          <button class="menu-btn" onclick="togglePause()">≡</button>
        </div>
        <div class="vital">
          <div id="fill-shield"></div>
          <div id="fill-hull"></div>
        </div>
      </div>
      <button id="btn-bomb" onclick="useBomb()">BOMB <span id="bomb-count">1</span></button>
    </div>

    <div class="overlay" id="screen-start">
  <h1>PULSE PIONEER IX</h1>
  
  <!-- 这就是机库面板 -->
  <div id="hangar-status" style="margin: 15px 0; padding: 10px; background: rgba(0,240,255,0.05); border: 1px solid rgba(0,240,255,0.3); border-radius: 8px; font-size: 12px; color: #a8b8d0; line-height: 1.6; width: 90%; max-width: 300px; text-align: left;">
    <div style="color: #00f0ff; font-weight: bold; margin-bottom: 5px;">🛸 机库装配状态 (Web3)</div>
    <div>钱包: <span id="status-wallet" style="color: #fff;">未连接</span></div>
    <div>代币: <span id="status-token" style="color: #ffd700;">0</span> QDUST</div>
    <div>NFT: <span id="status-nft" style="color: #aaa;">未持有</span></div>
    <!-- 添加代币按钮 -->
    <button onclick="addTokenToWallet()" style="margin-top: 8px; width: 100%; background: transparent; border: 1px solid #ffd700; color: #ffd700; padding: 5px; border-radius: 4px; font-size: 11px; cursor: pointer;">
      🦊 将 $QDUST 添加到钱包
    </button>
  </div>

  <button class="btn primary" onclick="startGame()">🚀 START ENGINE</button>
    </div>
    <div class="overlay" id="screen-gameover" style="display:none;">
      <h1>MISSION DEBRIEF</h1>
      <p>SCORE: <span id="res-score">0</span></p>
      <button class="btn primary" onclick="startGame()">🔄 RESTART</button>
    </div>
    <div class="overlay" id="screen-rogue">
      <h2>CHIP MATRIX UPGRADE</h2>
      <div id="rogue-cards"></div>
    </div>
  </div>

  <!-- 按顺序加载，注意路径加了 js/ -->
  <script src="state.js"></script>
  <script src="js/player.js"></script>
  <script src="js/enemy.js"></script>
  <script src="js/ui.js"></script>
  <script src="main.js"></script>
</body>
</html>
