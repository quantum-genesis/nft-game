<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Base Arcade: 脉冲先锋 | Web3 链上街机</title>
  <style>
    :root {
      --base-blue: #0052ff;
      --neon-cyan: #00f0ff;
      --neon-pink: #ff007f;
      --neon-amber: #ffaa00;
      --bg-dark: #07090e;
      --card-bg: rgba(13, 17, 28, 0.85);
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
      color: #fff;
      touch-action: none; /* 防止手机端页面拖动与回弹 */
    }
    #app-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 50% 30%, #111a33 0%, var(--bg-dark) 100%);
    }

    /* 顶部 Web3 状态栏 */
    #web3-header {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border-bottom: 1px solid rgba(0, 82, 255, 0.3);
      backdrop-filter: blur(10px);
      z-index: 10;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 4px 8px;
      border-radius: 20px;
      background: rgba(0, 82, 255, 0.15);
      border: 1px solid var(--base-blue);
      color: var(--neon-cyan);
    }
    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00ff66;
      box-shadow: 0 0 8px #00ff66;
    }
    .btn-connect {
      background: linear-gradient(135deg, var(--base-blue), #0036b3);
      color: #fff;
      border: 1px solid var(--neon-cyan);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 0 10px rgba(0, 82, 255, 0.4);
      transition: all 0.2s;
    }
    .btn-connect:active {
      transform: scale(0.96);
    }

    /* 游戏画布区 */
    #canvas-wrap {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* 游戏内 HUD 抬头显示 */
    #hud {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-family: monospace;
      font-size: 14px;
      font-weight: bold;
      text-shadow: 0 0 6px rgba(0, 240, 255, 0.8);
      z-index: 5;
    }

    /* 游戏 UI 浮层 (开始/结束) */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(7, 9, 14, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      z-index: 20;
    }
    .title-glitch {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 2px 2px 0px var(--neon-pink), -2px -2px 0px var(--neon-cyan);
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 12px;
      color: #8da2c4;
      margin-bottom: 24px;
      letter-spacing: 1px;
    }
    .card-box {
      width: 100%;
      background: rgba(20, 26, 43, 0.8);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      text-align: left;
      font-size: 13px;
      line-height: 1.6;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin: 4px 0;
      color: #b0c0d8;
    }
    .stat-val {
      font-weight: bold;
      color: var(--neon-cyan);
      font-family: monospace;
      font-size: 14px;
    }

    .btn-action {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--neon-cyan), var(--base-blue));
      color: #050a14;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-action:active {
      transform: scale(0.97);
    }

    /* 签名凭证窗口 */
    #sig-modal {
      position: absolute;
      inset: 12px;
      background: #0d121f;
      border: 1px solid var(--neon-cyan);
      border-radius: 14px;
      padding: 18px;
      display: none;
      flex-direction: column;
      z-index: 30;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
    }
    #sig-text {
      flex: 1;
      background: #060911;
      border: 1px solid #1a2744;
      border-radius: 8px;
      padding: 10px;
      font-family: monospace;
      font-size: 11px;
      color: #61f2c2;
      overflow-y: auto;
      word-break: break-all;
      white-space: pre-wrap;
      margin: 12px 0;
    }

    /* 提示小浮条 */
    #toast {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid var(--neon-cyan);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 100;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div id="app-container">
  <!-- 顶部 Web3 状态栏 -->
  <header id="web3-header">
    <div class="badge">
      <span class="badge-dot"></span>
      <span id="network-badge">BASE MAINNET</span>
    </div>
    <button class="btn-connect" id="btn-wallet" onclick="handleWalletClick()">
      <span>🦊</span>
      <span id="wallet-text">连接钱包</span>
    </button>
  </header>

  <!-- 游戏主画布 -->
  <div id="canvas-wrap">
    <canvas id="gameCanvas"></canvas>
    <div id="hud">
      <div>SCORE: <span id="hud-score" style="color:var(--neon-cyan)">0</span></div>
      <div>ENERGY: <span id="hud-energy" style="color:var(--neon-amber)">0</span></div>
      <div>SHIELD: <span id="hud-shield" style="color:#ff3366">100%</span></div>
    </div>
  </div>

  <!-- 初始开始界面 -->
  <div class="overlay" id="screen-start">
    <div class="title-glitch">PULSE PIONEER</div>
    <div class="subtitle">BASE NETWORK // 战术弹幕拦截机</div>
    <div class="card-box">
      <div style="color:var(--neon-cyan); font-weight:bold; margin-bottom:6px;">🎮 驾驶指南：</div>
      <p style="color:#94a3b8; font-size:12px; margin-bottom:8px;">• 手机：按住屏幕任意位置直接拖动战机</p>
      <p style="color:#94a3b8; font-size:12px; margin-bottom:8px;">• 电脑：键盘 WASD 或鼠标按住拖拽</p>
      <p style="color:#94a3b8; font-size:12px;">• 目标：避开红色暗能球，拦截敌机并吸收金色脉冲晶核！</p>
    </div>
    <button class="btn-action btn-primary" onclick="startGame()">
      <span>🚀</span> 启动量子推进引擎 (START)
    </button>
  </div>

  <!-- 结算界面 -->
  <div class="overlay" id="screen-gameover" style="display: none;">
    <div class="title-glitch" style="text-shadow: 2px 2px 0px #f00, -2px -2px 0px #fff;">HULL BREACHED</div>
    <div class="subtitle">战机受损坠毁 // 战斗数据已锁定</div>
    <div class="card-box">
      <div class="stat-row"><span>最终得分 (Score)</span><span class="stat-val" id="res-score">0</span></div>
      <div class="stat-row"><span>暗能晶核 (Crystals)</span><span class="stat-val" id="res-crystals">0</span></div>
      <div class="stat-row"><span>最高历史记录</span><span class="stat-val" id="res-high">0</span></div>
      <div class="stat-row"><span>驾驶员地址</span><span class="stat-val" id="res-wallet" style="font-size:11px;">未连接</span></div>
    </div>
    <button class="btn-action btn-primary" id="btn-sign" onclick="signCombatRecord()">
      <span>✍️</span> 签名战报并验证防伪 (Web3 Sign)
    </button>
    <button class="btn-action btn-secondary" onclick="restartGame()">
      <span>🔄</span> 重新出击 (Restart)
    </button>
  </div>

  <!-- 签名证明弹出框 -->
  <div id="sig-modal">
    <div style="font-weight:bold; color:var(--neon-cyan); display:flex; justify-content:space-between;">
      <span>🛡️ 链上私钥签名证书</span>
      <span style="cursor:pointer;" onclick="closeSigModal()">✕</span>
    </div>
    <div id="sig-text"></div>
    <button class="btn-action btn-primary" onclick="closeSigModal()">确定并返回</button>
  </div>

  <!-- 气泡提示 -->
  <div id="toast"></div>
</div>

<script>
/* ============================================================
   1. 8-Bit Web Audio 合成音效 (无需任何外链音频文件)
============================================================ */
const AudioSys = {
  ctx: null,
  init() {
    if (!this.ctx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioContext();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  },
  playLaser() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(800, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(150, this.ctx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.12);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.12);
  },
  playExplode() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(160, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.3);
  },
  playCrystal() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(520, this.ctx.currentTime);
    osc.frequency.setValueAtTime(780, this.ctx.currentTime + 0.08);
    osc.frequency.setValueAtTime(1040, this.ctx.currentTime + 0.16);
    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.25);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.25);
  }
};

/* ============================================================
   2. Web3 / Base 链交互逻辑 (零第三方库依赖，纯原生通信)
============================================================ */
const BASE_CHAIN_ID_HEX = '0x2105'; // 8453 (Base Mainnet)
const BASE_CONFIG = {
  chainId: BASE_CHAIN_ID_HEX,
  chainName: 'Base',
  nativeCurrency: { name: 'Ether', symbol: 'ETH', decimals: 18 },
  rpcUrls: ['https://mainnet.base.org'],
  blockExplorerUrls: ['https://basescan.org']
};

let userAccount = null;
let userBalance = '0.000';

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.style.opacity = '1';
  setTimeout(() => { t.style.opacity = '0'; }, 2600);
}

async function handleWalletClick() {
  AudioSys.init();
  if (typeof window.ethereum === 'undefined') {
    showToast('⚠️ 未检测到钱包！请在 MetaMask App 内置浏览器中打开');
    return;
  }
  try {
    // 1. 请求连接账户
    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
    if (!accounts || accounts.length === 0) return;
    userAccount = accounts[0];

    // 2. 检查并强制切换至 Base 链
    await ensureBaseNetwork();

    // 3. 查余额
    await fetchBalance();

    updateWalletUI();
    showToast('✅ 钱包已成功连接至 Base 主网！');
  } catch (err) {
    console.error(err);
    showToast('❌ 连接失败: ' + (err.message || err));
  }
}

async function ensureBaseNetwork() {
  const currentChain = await window.ethereum.request({ method: 'eth_chainId' });
  if (currentChain !== BASE_CHAIN_ID_HEX) {
    try {
      await window.ethereum.request({
        method: 'wallet_switchEthereumChain',
        params: [{ chainId: BASE_CHAIN_ID_HEX }]
      });
    } catch (switchError) {
      if (switchError.code === 4902) {
        await window.ethereum.request({
          method: 'wallet_addEthereumChain',
          params: [BASE_CONFIG]
        });
      } else {
        throw switchError;
      }
    }
  }
}

async function fetchBalance() {
  if (!userAccount) return;
  try {
    const rawBalance = await window.ethereum.request({
      method: 'eth_getBalance',
      params: [userAccount, 'latest']
    });
    const wei = BigInt(rawBalance);
    const eth = Number(wei) / 1e18;
    userBalance = eth.toFixed(4);
  } catch (e) {
    console.warn('获取余额失败', e);
  }
}

function updateWalletUI() {
  if (!userAccount) return;
  const shortAddr = userAccount.slice(0, 4) + '...' + userAccount.slice(-3);
  document.getElementById('wallet-text').innerText = `${shortAddr} (${userBalance} ETH)`;
  document.getElementById('btn-wallet').style.borderColor = '#00ff66';
  document.getElementById('res-wallet').innerText = userAccount.slice(0, 8) + '...' + userAccount.slice(-6);
}

// 战报签名逻辑 (无需 Gas 费，用私钥为高分盖戳防篡改)
async function signCombatRecord() {
  AudioSys.init();
  if (!userAccount) {
    await handleWalletClick();
    if (!userAccount) return;
  }

  const payload = {
    domain: "Quantum Arcade - Base Network",
    pilot: userAccount,
    score: Game.score,
    energyCrystals: Game.crystals,
    timestamp: new Date().toISOString(),
    chainId: 8453,
    status: "COMBAT_VERIFIED_AUTHENTIC"
  };

  const message = `[PULSE PIONEER 战报公证]
----------------------------------
驾驶员: ${payload.pilot}
最终战功: ${payload.score} PTS
捕获暗能: ${payload.energyCrystals} 晶核
公证网络: Base Mainnet (8453)
时间戳: ${payload.timestamp}
----------------------------------
请签名确认本局战报防伪指纹。此操作不会扣除任何 Gas 费。`;

  try {
    // 转换成十六进制传递给 personal_sign
    const hexMsg = '0x' + Array.from(new TextEncoder().encode(message))
      .map(b => b.toString(16).padStart(2, '0')).join('');

    const signature = await window.ethereum.request({
      method: 'personal_sign',
      params: [hexMsg, userAccount]
    });

    const certText = `=== 链上战报防伪证书 (PASSED) ===\n\n` +
      `【明文摘要】\n${message}\n\n` +
      `【ECDSA 签名 Hash】\n${signature}\n\n` +
      `【验证状态】: 凭证与公钥完全匹配，已防伪锁定。`;

    document.getElementById('sig-text').innerText = certText;
    document.getElementById('sig-modal').style.display = 'flex';
    AudioSys.playCrystal();
  } catch (err) {
    showToast('签名已取消或失败: ' + (err.message || ''));
  }
}

function closeSigModal() {
  document.getElementById('sig-modal').style.display = 'none';
}

/* ============================================================
   3. 街机弹幕引擎 (支持手机触摸跟随 + 桌面按键/拖拽)
============================================================ */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvas-wrap');

function resizeCanvas() {
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const Game = {
  running: false,
  score: 0,
  crystals: 0,
  highScore: parseInt(localStorage.getItem('base_arcade_high') || '0'),
  shield: 100,
  player: { x: 0, y: 0, r: 16, targetX: 0, targetY: 0 },
  bullets: [],
  enemies: [],
  particles: [],
  crystalsItems: [],
  stars: [],
  lastShot: 0,
  spawnTimer: 0
};

// 初始化星空背景
for (let i = 0; i < 45; i++) {
  Game.stars.push({
    x: Math.random() * 500,
    y: Math.random() * 800,
    speed: 0.5 + Math.random() * 1.5,
    size: 1 + Math.random() * 2
  });
}

function startGame() {
  AudioSys.init();
  resizeCanvas();
  Game.running = true;
  Game.score = 0;
  Game.crystals = 0;
  Game.shield = 100;
  Game.bullets = [];
  Game.enemies = [];
  Game.particles = [];
  Game.crystalsItems = [];
  Game.player.x = canvas.width / 2;
  Game.player.y = canvas.height - 80;
  Game.player.targetX = Game.player.x;
  Game.player.targetY = Game.player.y;

  document.getElementById('screen-start').style.display = 'none';
  document.getElementById('screen-gameover').style.display = 'none';
  updateHUD();
}

function restartGame() {
  startGame();
}

function gameOver() {
  Game.running = false;
  AudioSys.playExplode();

  if (Game.score > Game.highScore) {
    Game.highScore = Game.score;
    localStorage.setItem('base_arcade_high', Game.highScore.toString());
  }

  document.getElementById('res-score').innerText = Game.score;
  document.getElementById('res-crystals').innerText = Game.crystals;
  document.getElementById('res-high').innerText = Game.highScore;
  document.getElementById('screen-gameover').style.display = 'flex';
}

function updateHUD() {
  document.getElementById('hud-score').innerText = Game.score;
  document.getElementById('hud-energy').innerText = Game.crystals;
  const s = Math.max(0, Math.floor(Game.shield));
  document.getElementById('hud-shield').innerText = `${s}%`;
  document.getElementById('hud-shield').style.color = s > 30 ? '#00f0ff' : '#ff3366';
}

// 触摸/鼠标交互
let isPointerDown = false;
function setTargetPos(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  Game.player.targetX = clientX - rect.left;
  Game.player.targetY = clientY - rect.top;
}

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  isPointerDown = true;
  if (e.touches[0]) setTargetPos(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (isPointerDown && e.touches[0]) {
    setTargetPos(e.touches[0].clientX, e.touches[0].clientY);
  }
}, { passive: false });

window.addEventListener('touchend', () => { isPointerDown = false; });

canvas.addEventListener('mousedown', (e) => {
  isPointerDown = true;
  setTargetPos(e.clientX, e.clientY);
});
window.addEventListener('mousemove', (e) => {
  if (isPointerDown) setTargetPos(e.clientX, e.clientY);
});
window.addEventListener('mouseup', () => { isPointerDown = false; });

// 键盘控制支持
const keys = {};
window.addEventListener('keydown', (e) => { keys[e.key] = true; });
window.addEventListener('keyup', (e) => { keys[e.key] = false; });

/* ============================================================
   4. 主游戏循环
============================================================ */
function loop(now) {
  requestAnimationFrame(loop);

  // 清屏与深空渐变
  ctx.fillStyle = '#060911';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 绘制星空移动
  ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
  for (let s of Game.stars) {
    s.y += s.speed;
    if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }

  if (!Game.running) return;

  // 玩家位置平滑跟随
  if (keys['ArrowLeft'] || keys['a']) Game.player.x -= 5;
  if (keys['ArrowRight'] || keys['d']) Game.player.x += 5;
  if (keys['ArrowUp'] || keys['w']) Game.player.y -= 5;
  if (keys['ArrowDown'] || keys['s']) Game.player.y += 5;

  Game.player.x += (Game.player.targetX - Game.player.x) * 0.22;
  Game.player.y += (Game.player.targetY - Game.player.y) * 0.22;

  // 边界约束
  Game.player.x = Math.max(20, Math.min(canvas.width - 20, Game.player.x));
  Game.player.y = Math.max(30, Math.min(canvas.height - 30, Game.player.y));

  // 自动极速射击
  if (now - Game.lastShot > 140) {
    Game.bullets.push({ x: Game.player.x - 7, y: Game.player.y - 15, vy: -11 });
    Game.bullets.push({ x: Game.player.x + 7, y: Game.player.y - 15, vy: -11 });
    AudioSys.playLaser();
    Game.lastShot = now;
  }

  // 敌机生成
  Game.spawnTimer++;
  if (Game.spawnTimer % 36 === 0) {
    const isHeavy = Math.random() < 0.22;
    Game.enemies.push({
      x: 20 + Math.random() * (canvas.width - 40),
      y: -25,
      r: isHeavy ? 20 : 13,
      hp: isHeavy ? 4 : 1,
      speed: isHeavy ? 1.8 : (2.5 + Math.random() * 2),
      color: isHeavy ? '#ff0055' : '#ffaa00'
    });
  }

  // 更新子弹
  for (let i = Game.bullets.length - 1; i >= 0; i--) {
    let b = Game.bullets[i];
    b.y += b.vy;
    ctx.fillStyle = '#00f0ff';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 8;
    ctx.fillRect(b.x - 2, b.y - 6, 4, 12);
    ctx.shadowBlur = 0;

    if (b.y < -10) Game.bullets.splice(i, 1);
  }

  // 更新敌机
  for (let i = Game.enemies.length - 1; i >= 0; i--) {
    let e = Game.enemies[i];
    e.y += e.speed;

    // 绘制敌机
    ctx.fillStyle = e.color;
    ctx.shadowColor = e.color;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // 检查子弹碰撞
    for (let j = Game.bullets.length - 1; j >= 0; j--) {
      let b = Game.bullets[j];
      const dist = Math.hypot(e.x - b.x, e.y - b.y);
      if (dist < e.r + 5) {
        Game.bullets.splice(j, 1);
        e.hp--;
        if (e.hp <= 0) {
          // 爆炸效果
          createExplosion(e.x, e.y, e.color);
          AudioSys.playExplode();
          Game.score += 150;

          // 掉落暗能晶核
          if (Math.random() < 0.45) {
            Game.crystalsItems.push({ x: e.x, y: e.y, vy: 1.5 });
          }

          Game.enemies.splice(i, 1);
          updateHUD();
          break;
        }
      }
    }

    // 检查与玩家本体碰撞
    const pDist = Math.hypot(e.x - Game.player.x, e.y - Game.player.y);
    if (pDist < e.r + Game.player.r) {
      Game.shield -= 34;
      createExplosion(e.x, e.y, '#ff0033');
      Game.enemies.splice(i, 1);
      updateHUD();
      if (Game.shield <= 0) {
        gameOver();
        return;
      }
    }

    if (e.y > canvas.height + 30) Game.enemies.splice(i, 1);
  }

  // 更新晶核
  for (let i = Game.crystalsItems.length - 1; i >= 0; i--) {
    let c = Game.crystalsItems[i];
    c.y += c.vy;

    // 金色旋转晶核
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(now * 0.005);
    ctx.fillStyle = '#ffaa00';
    ctx.shadowColor = '#ffaa00';
    ctx.shadowBlur = 10;
    ctx.fillRect(-6, -6, 12, 12);
    ctx.restore();

    // 吸收检测
    if (Math.hypot(c.x - Game.player.x, c.y - Game.player.y) < Game.player.r + 14) {
      Game.crystals++;
      Game.score += 300;
      AudioSys.playCrystal();
      Game.crystalsItems.splice(i, 1);
      updateHUD();
    } else if (c.y > canvas.height + 20) {
      Game.crystalsItems.splice(i, 1);
    }
  }

  // 粒子动画
  for (let i = Game.particles.length - 1; i >= 0; i--) {
    let p = Game.particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.035;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillRect(p.x, p.y, p.size, p.size);
    ctx.globalAlpha = 1.0;
    if (p.life <= 0) Game.particles.splice(i, 1);
  }

  // 绘制玩家飞船 (赛博青色三角战机)
  drawPlayerShip(Game.player.x, Game.player.y);
}

function drawPlayerShip(x, y) {
  ctx.save();
  ctx.translate(x, y);

  // 尾焰
  ctx.fillStyle = '#ff0055';
  ctx.beginPath();
  ctx.moveTo(-5, 12);
  ctx.lineTo(0, 22 + Math.random() * 8);
  ctx.lineTo(5, 12);
  ctx.fill();

  // 主机体
  ctx.fillStyle = '#00f0ff';
  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.moveTo(0, -18);
  ctx.lineTo(15, 12);
  ctx.lineTo(0, 6);
  ctx.lineTo(-15, 12);
  ctx.closePath();
  ctx.fill();

  // 核心舱
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(0, 0, 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 14; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 4;
    Game.particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      color,
      size: 2 + Math.random() * 3,
      life: 1.0
    });
  }
}

// 启动循环
requestAnimationFrame(loop);

// 自动检测是否已有现成钱包注入
window.addEventListener('load', () => {
  if (typeof window.ethereum !== 'undefined' && window.ethereum.selectedAddress) {
    userAccount = window.ethereum.selectedAddress;
    updateWalletUI();
  }
});
</script>
